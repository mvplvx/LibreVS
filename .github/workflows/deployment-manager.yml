name: Deployment Manager

on:
  push:
    paths:
      - "deployment/**"
      - ".github/workflows/deployment-manager.yml"
  pull_request:
    paths:
      - "deployment/**"
      - ".github/workflows/deployment-manager.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  verify:
    name: Typecheck, lint, test, Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deployment/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-linux:
    name: Linux AppImage + deb
    runs-on: ubuntu-22.04
    needs: verify
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deployment/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
      - run: npm ci
      - name: Toolchain check
        run: |
          rustc --version
          cargo --version
          npx tauri --version
      - name: Build Tauri (Linux AppImage + deb only)
        # Platform-specific bundles — do not build Windows targets on Linux.
        run: |
          set -o pipefail
          npx tauri build --bundles appimage,deb --verbose 2>&1 | tee tauri-build.log
      - name: Publish failure log
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'deployment/tauri-build.log';
            let body = 'Linux Tauri build failed. Log file missing.';
            if (fs.existsSync(path)) {
              const log = fs.readFileSync(path, 'utf8');
              const tail = log.split(/\r?\n/).slice(-250).join('\n');
              body = [
                `### Linux Tauri build failure`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Commit: ${context.sha}`,
                '',
                '```text',
                tail,
                '```',
              ].join('\n');
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ci: Linux Deployment Manager packaging failure (${context.sha.slice(0,7)})`,
              body,
            });
            const summary = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8').split(/\r?\n/).slice(-120).join('\n')
              : 'no log';
            await core.summary
              .addHeading('Linux Tauri build failure')
              .addCodeBlock(summary, 'text')
              .write();
      - name: List Linux bundle outputs
        if: success()
        run: |
          echo "Bundle directory contents:"
          find src-tauri/target/release/bundle -type f 2>/dev/null | sort || true
      - name: Upload Linux artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: librevs-deployment-manager-linux
          path: |
            deployment/src-tauri/target/release/bundle/appimage/*.AppImage
            deployment/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    name: Windows NSIS + MSI
    runs-on: windows-latest
    needs: verify
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deployment/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install WebView2 (ensure present)
        shell: pwsh
        run: |
          Write-Host "WebView2 is typically preinstalled on windows-latest runners."
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Out-String
      - run: npm ci
        shell: pwsh
      - name: Toolchain check
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          npx tauri --version
          Get-Command cargo | Format-List
          $env:PATH -split ';' | Select-String -Pattern 'cargo|rust|\.cargo'
      - name: Build Tauri (Windows NSIS + MSI only)
        # Platform-specific bundles — do not build Linux targets on Windows.
        # Use pwsh so Cargo from rust-toolchain stays on PATH (bash often misses it).
        shell: pwsh
        run: |
          npx tauri build --bundles nsis,msi --verbose 2>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish failure log
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'deployment/tauri-build.log';
            let body = 'Windows Tauri build failed. Log file missing.';
            if (fs.existsSync(path)) {
              const log = fs.readFileSync(path, 'utf8');
              const tail = log.split(/\r?\n/).slice(-250).join('\n');
              body = [
                `### Windows Tauri build failure`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Commit: ${context.sha}`,
                '',
                '```text',
                tail,
                '```',
              ].join('\n');
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ci: Windows Deployment Manager packaging failure (${context.sha.slice(0,7)})`,
              body,
            });
            const summary = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8').split(/\r?\n/).slice(-120).join('\n')
              : 'no log';
            await core.summary
              .addHeading('Windows Tauri build failure')
              .addCodeBlock(summary, 'text')
              .write();
      - name: List Windows bundle outputs
        if: success()
        shell: pwsh
        run: |
          Write-Host "Bundle directory contents:"
          if (Test-Path src-tauri/target/release/bundle) {
            Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName, Length
          }
      - name: Upload Windows artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: librevs-deployment-manager-windows
          path: |
            deployment/src-tauri/target/release/bundle/nsis/*.exe
            deployment/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
