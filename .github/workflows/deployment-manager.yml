name: Deployment Manager

on:
  push:
    paths:
      - "deployment/**"
      - ".github/workflows/deployment-manager.yml"
  pull_request:
    paths:
      - "deployment/**"
      - ".github/workflows/deployment-manager.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Typecheck, lint, test, Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: deployment/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-linux:
    name: Linux AppImage + deb
    runs-on: ubuntu-22.04
    needs: verify
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: deployment/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Build Tauri (Linux AppImage + deb only)
        # Platform-specific bundles — do not build Windows targets on Linux.
        run: npx tauri build --bundles appimage,deb
      - name: List Linux bundle outputs
        run: |
          echo "Bundle directory contents:"
          find src-tauri/target/release/bundle -type f 2>/dev/null | sort || true
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librevs-deployment-manager-linux
          path: |
            deployment/src-tauri/target/release/bundle/appimage/*.AppImage
            deployment/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    name: Windows NSIS + MSI
    runs-on: windows-latest
    needs: verify
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: deployment/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install WebView2 (ensure present)
        shell: powershell
        run: |
          Write-Host "WebView2 is typically preinstalled on windows-latest runners."
          Get-ItemProperty HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5} -ErrorAction SilentlyContinue | Out-String
      - run: npm ci
      - name: Build Tauri (Windows NSIS + MSI only)
        # Platform-specific bundles — do not build Linux targets on Windows.
        shell: bash
        run: npx tauri build --bundles nsis,msi
      - name: List Windows bundle outputs
        shell: bash
        run: |
          echo "Bundle directory contents:"
          find src-tauri/target/release/bundle -type f 2>/dev/null | sort || true
          ls -la src-tauri/target/release/bundle/nsis 2>/dev/null || true
          ls -la src-tauri/target/release/bundle/msi 2>/dev/null || true
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librevs-deployment-manager-windows
          path: |
            deployment/src-tauri/target/release/bundle/nsis/*.exe
            deployment/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
