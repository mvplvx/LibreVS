[package]
name = "librevs-deployment-manager"
version = "0.8.0"
description = "LibreVS Deployment Manager — official operational interface for self-hosted VSME reporting"
authors = ["LibreVS"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "librevs_deployment_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
open = "5"
